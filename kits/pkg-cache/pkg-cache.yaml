# syntax=docker/sandbox-kit:3
# A prepared package cache, offline: a headless-only v3 mixin, its image built from
# pkg-cache.dockerfile. See docs/addons.md, *Prepared package caches (npm, pip, uv)*. The description is
# written for the agent: sbx lists it in the context file's `## Kits` section.
schemaVersion: "3"
kind: mixin
displayName: Prepared package caches (npm, pip, uv, cargo), offline
description: >-
  A package cache prepared outside the sandbox for this repository: npm, pip, uv and cargo
  install its JavaScript, Python and Rust dependencies with no network. Relevant before
  installing them.

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: ["sh", "/usr/local/lib/aisbx/pkg-cache/startup.sh"]
          user: agent
          description: "Copy the mounted package cache (marker .aisbx-pkg-cache) into sandbox-local caches (idempotent; tolerates no mount)"

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        Dependencies install offline from a prepared cache: `npm ci` (npm_config_offline is set),
        `uv sync --frozen`, or `uv venv && uv pip install -r requirements.txt` (pip and uv read the
        wheels through PIP_FIND_LINKS / UV_FIND_LINKS with no index); cargo builds the crates
        Cargo.lock pins (CARGO_NET_OFFLINE is set). There is no network: what the
        cache does not hold cannot be installed - say so in your result instead of trying another way.
        The mounted cache folder itself is read-only; never write there.
