# syntax=docker/sandbox-kit:3
# The host's Maven repository, read-only: a v3 mixin, its image built from host-maven.dockerfile.
# See docs/addons.md, *Host Maven/Gradle caches (read-only)*. The description is written for the agent:
# sbx lists it in the context file's `## Kits` section.
schemaVersion: "3"
kind: mixin
displayName: Host Maven caches (read-only)
description: >-
  The host's Maven local repository and wrapper distributions, read-only: Maven builds
  resolve what the host already downloaded without network, and new downloads stay
  in the sandbox. Relevant before running Maven or ./mvnw.

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: ["sh", "/usr/local/lib/aisbx/host-jvm-caches/startup.sh", "maven"]
          user: agent
          description: "Symlink the mounted host Maven repository under ~/.host-caches and seed Maven wrapper dists (idempotent; tolerates missing mounts)"

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        The host's Maven local repository is mounted read-only and wired via
        maven.repo.local.tail in MAVEN_OPTS (Maven >= 3.9). Resolution reads it
        transparently; new downloads land in the sandbox-local ~/.m2/repository. Maven
        wrapper dists the host already has are pre-seeded into ~/.m2/wrapper/dists, so
        ./mvnw starts without download egress for those versions (others still download
        as usual). Never write under /home/agent/.host-caches or the /Users/... | /home/...
        mounts - they are read-only.
