# syntax=docker/sandbox-kit:3
# Pi (pi.dev) against a LiteLLM gateway: a v3 workload, its image built from pi-litellm.dockerfile.
schemaVersion: "3"
kind: workload
displayName: Pi (LiteLLM)
description: Run Pi (pi.dev), a minimal coding agent, against a LiteLLM gateway. The gateway, its models and the key's placeholder come from the connection kit aisbx generates and stacks next to this one, which writes Pi's ~/.pi/agent/models.json (one provider, `litellm-<connection>`) and settings.json; the real key stays in the host keychain and the host proxy swaps it in, so there is no sign-in to do and `/login` cannot reach any provider. Pi runs every tool call without asking. aisbx writes the gateway's model list and the default model into models.json and settings.json before each session; pick another model with `/model`.

# No credential and no gateway on purpose: the generated connection kit writes Pi's models.json and
# settings.json with the key's placeholder (docs/agents.md, *Pi*).

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - registry.npmjs.org       # files/pi/update.sh create: npm metadata and tarballs
      runtime:
        allow:
          # No gateway host here: the connection kit allows it. Not allowed on purpose: pi.dev, any
          # model provider's own API, GitHub.
          - registry.npmjs.org       # the dashboard's pre-start update (npm)
          - plugins.gradle.org
          - plugins-artifacts.gradle.org
          - ports.ubuntu.com
          - archive.ubuntu.com
          - security.ubuntu.com
          - download.docker.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      # No model-list hook on purpose: aisbx writes the list before each session.
      install:
        - command: ["sh", "/usr/local/lib/aisbx/pi/update.sh", "create"]
          user: agent
          description: Update Pi to the current release

  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
