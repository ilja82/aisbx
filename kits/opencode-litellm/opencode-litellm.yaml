# syntax=docker/sandbox-kit:3
# OpenCode against a LiteLLM gateway: a v3 workload, its image built from opencode-litellm.dockerfile.
schemaVersion: "3"
kind: workload
displayName: OpenCode (LiteLLM)
description: Run OpenCode against a LiteLLM gateway. The gateway, its models and the key's placeholder come from the connection kit aisbx generates and stacks next to this one; the real key stays in the host keychain and the host proxy swaps it in. Runs unattended (auto-approve).

# No credential and no gateway on purpose: the generated connection kit writes OpenCode's config
# with the key's placeholder and points OPENCODE_CONFIG at it (docs/agents.md, *OpenCode*).

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - registry.npmjs.org         # files/opencode/update.sh: npm metadata and tarballs
          - "*.npmjs.org"
      runtime:
        allow:
          # No gateway host here: the connection kit allows it.
          - registry.npmjs.org         # the dashboard's pre-start update (npm)
          - "*.npmjs.org"              # npm CDN hosts
          - models.dev                 # OpenCode's model catalog (capabilities, metadata)
          - github.com                 # release pages
          - "*.github.com"             # api.github.com, codeload.github.com
          - "*.githubusercontent.com"  # release assets (language servers OpenCode fetches)
          - plugins.gradle.org
          - plugins-artifacts.gradle.org
          - ports.ubuntu.com
          - archive.ubuntu.com
          - security.ubuntu.com
          - download.docker.com

  # sbx's shared skills store, linked into ~/.config/opencode/skills by files/skills/skills-store.sh.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config: {path: /home/agent/.local/share/aisbx/skills-store, mode: readwrite}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: ["sh", "/usr/local/lib/aisbx/opencode/seed.sh"]
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the MCP gateway in opencode.json
        - command: ["sh", "/usr/local/lib/aisbx/skills/skills-store.sh", "/home/agent/.config/opencode/skills"]
          user: agent
          description: Link the shared skills store into ~/.config/opencode/skills
        - command: ["sh", "/usr/local/lib/aisbx/opencode/update.sh"]
          user: agent
          # A hook sees only what it declares; without the template's npm prefix npm installs into
          # /usr/local, which the agent cannot write.
          env: [OPENCODE_LITELLM_VERSION, NPM_CONFIG_PREFIX]
          description: Update OpenCode within the OPENCODE_LITELLM_VERSION range
      startup:
        - command: ["sh", "/usr/local/lib/aisbx/skills/skills-store.sh", "/home/agent/.config/opencode/skills"]
          user: agent
          description: Refresh the shared-skills links

  # OpenCode's global rules file, so a start folder anywhere sees the kits' instructions.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      directory: /home/agent/.config/opencode
