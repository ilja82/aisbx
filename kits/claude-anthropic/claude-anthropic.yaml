# syntax=docker/sandbox-kit:3
# Claude Code on an Anthropic subscription, signed in with `/login`: a v3 workload, its image built
# from claude-anthropic.dockerfile. The capabilities after the credential are the same as in
# kits/claude-litellm/claude-litellm.yaml.
schemaVersion: "3"
kind: workload
displayName: Claude Code (Anthropic subscription)
description: Run Claude Code against an Anthropic subscription (Enterprise / Pro / Max) instead of a LiteLLM gateway, signing in with `/login` inside the sandbox. That login is host-global - every sandbox using this kit runs as the same account. For a second, simultaneous account use kits/claude-token/ instead.

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - downloads.claude.ai          # `claude update` (files/claude/update.sh)
      runtime:
        allow:
          # Not allowed on purpose: console.anthropic.com, statsig.anthropic.com.
          - api.anthropic.com            # Messages API
          - claude.ai                    # OAuth authorize, subscription auth
          - platform.claude.com          # OAuth token endpoint (/v1/oauth/token)
          - claude.com                   # account pages /login hands off to
          - mcp-proxy.anthropic.com      # claude.ai connectors
          - bridge.claudeusercontent.com # /remote-control (sbx settings set claude.remoteControl true)
          - downloads.claude.ai          # the dashboard's `claude update` before a session
          - code.claude.com              # the Claude Code docs its bundled claude-code skill fetches
          - plugins.gradle.org
          - plugins-artifacts.gradle.org
          - ports.ubuntu.com
          - archive.ubuntu.com
          - security.ubuntu.com
          - download.docker.com

  # Authentication: the host-global `/login`, the `anthropic` credential of sbx's built-in `claude`
  # agent. aisbx writes its binding before every create (core/src/bindings.rs). optional: a sandbox
  # with no stored login starts and signs in with `/login`.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: The host-global /login (or an Anthropic API key stored as the `anthropic` secret)
    config:
      service: anthropic
      phase: runtime
      # An API key stored under `anthropic` instead of a login. Not proxy-managed: a sentinel in
      # ANTHROPIC_API_KEY would shadow a /login. files/claude/seed.sh writes the apiKeyHelper instead.
      apiKey:
        name: ANTHROPIC_API_KEY
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: mcp-proxy.anthropic.com, header: x-api-key, format: "%s"}
      oauth:
        tokenEndpoint: {host: platform.claude.com, path: /v1/oauth/token}
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          path: ~/.claude/.credentials.json
          structure:
            claudeAiOauth:
              accessToken: "{{.AccessToken}}"
              refreshToken: "{{.RefreshToken}}"
              expiresAt: "{{.ExpiresAt}}"
              scopes: "{{.Scopes}}"
            primaryApiKey: "{{.PrimaryApiKey}}"

  - type: com.docker.sandbox/volume@1
    description: Conversation transcripts
    config: {path: /home/agent/.claude/projects, size: 2g}
  - type: com.docker.sandbox/volume@1
    description: Per-session state (`claude -c`)
    config: {path: /home/agent/.claude/sessions, size: 512m}
  - type: com.docker.sandbox/volume@1
    description: TodoWrite state
    config: {path: /home/agent/.claude/todos, size: 512m}
  - type: com.docker.sandbox/volume@1
    description: Bash state across sessions
    config: {path: /home/agent/.claude/shell-snapshots, size: 512m}
  - type: com.docker.sandbox/volume@1
    description: Local feature-flag cache
    config: {path: /home/agent/.claude/statsig, size: 512m}

  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config: {path: /home/agent/.local/share/aisbx/skills-store, mode: readwrite}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: ["sh", "/usr/local/lib/aisbx/claude/prepare.sh"]
          user: "0"
          description: Make ~/.claude and the session volumes the agent's
        - command: ["sh", "/usr/local/lib/aisbx/claude/seed.sh"]
          user: agent
          env: [WORKSPACE_DIR, SBX_CRED_ANTHROPIC_MODE, MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME,
                CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, DISABLE_TELEMETRY, DISABLE_ERROR_REPORTING,
                DISABLE_FEEDBACK_COMMAND, DISABLE_BUG_COMMAND, CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY,
                DISABLE_GROWTHBOOK, DO_NOT_TRACK, DISABLE_AUTOUPDATER]
          description: Trust the workspace, bypass permissions, register the MCP gateway
        - command: ["sh", "/usr/local/lib/aisbx/skills/skills-store.sh", "/home/agent/.claude/skills"]
          user: agent
          description: Link the shared skills store into ~/.claude/skills
        - command: ["sh", "/usr/local/lib/aisbx/claude/update.sh"]
          user: agent
          env: [CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, DISABLE_TELEMETRY, DISABLE_ERROR_REPORTING,
                DISABLE_FEEDBACK_COMMAND, DISABLE_BUG_COMMAND, CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY,
                DISABLE_GROWTHBOOK, DO_NOT_TRACK, DISABLE_AUTOUPDATER]
          description: Update Claude Code to the current release
      startup:
        - command: ["sh", "/usr/local/lib/aisbx/claude/prepare.sh"]
          user: "0"
          description: Keep the session volumes the agent's
        - command: ["sh", "/usr/local/lib/aisbx/skills/skills-store.sh", "/home/agent/.claude/skills"]
          user: agent
          description: Refresh the shared-skills links

  - type: com.docker.sandbox/agent-context@1
    config:
      filename: CLAUDE.md
