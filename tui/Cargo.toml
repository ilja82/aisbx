[package]
name = "aisbx"
version.workspace = true
edition.workspace = true
description = "aisbx: a terminal dashboard and headless CLI for AI coding agents in Docker Sandboxes (sbx)"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aisbx-core = { path = "../core" }
anyhow = "1.0.104"
crossterm = "0.29.0"
ctrlc = "3.5.2"
ratatui = "0.30.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[dev-dependencies]
# test-support (host guards, test fixtures) for this crate's tests only; never in [dependencies].
aisbx-core = { path = "../core", features = ["test-support"] }
